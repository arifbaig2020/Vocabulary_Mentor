<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vocabulary Mentor AI</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="nav">
    <button onclick="showPage('home')">Home</button>
    <button onclick="showPage('setup')">Start Quiz</button>
</div>

<div class="container">

<div id="home" class="card">
    <h2>Welcome Arif 👋</h2>
</div>

<!-- SETUP -->
<div id="setup" class="card" style="display:none;">

    <h3>Difficulty</h3>
    <select id="difficulty" onchange="updateSets()">
        <option value="EASY">Easy</option>
        <option value="MEDIUM">Medium</option>
        <option value="HARD">Hard</option>
    </select>

    <h3>Set</h3>
    <select id="setSelector"></select>

    <br><br>
    <button onclick="startQuiz()">Start</button>

</div>

<!-- QUIZ -->
<div id="quiz" class="card" style="display:none;">

    <div class="quiz-status">

        <div class="status-row">

            <span id="wordCounter">
                Word 1 / 30
            </span>

            <span id="mastered">
                Mastered : 0
            </span>

            <span id="remaining">
                Remaining : 30
            </span>

        </div>

        <div class="progress">

            <div id="progressBar"></div>

        </div>

    </div>

    <h3 id="label"></h3>

    <div style="display:flex; align-items:center;gap:10px;">
        <h2 id="word"></h2>
    </div>

    <div id="options"></div>

</div>

<!-- RESULT -->
<div id="result" class="card" style="display:none;">
    
    <div id="resultDetails"></div>

</div>

<!-- FINISH -->
<div id="finish" class="card" style="display:none;">

    <h2>🎉 Congratulations!</h2>

    <p>You have successfully completed this quiz set.</p>

    <table class="result-table">

        <tr>
            <td>Total Words</td>
            <td id="finishTotal"></td>
        </tr>

        <tr>
            <td>Mastered</td>
            <td id="finishMastered"></td>
        </tr>

        <tr>
            <td>Remaining</td>
            <td id="finishRemaining"></td>
        </tr>

    </table>

    <br>

    <button onclick="showPage('setup')">
        Start Another Set
    </button>

    <button onclick="showPage('home')">
        Home
    </button>

<!-- FINISH -->

<!-- FINISH -->
<div id="finish" class="card" style="display:none;">

    <h2>🎉 Quiz Completed!</h2>

    <p>Congratulations! You've mastered this set.</p>

    <table class="result-table">

        <tr>
            <td>Total Words</td>
            <td id="finishTotal"></td>
        </tr>

        <tr>
            <td>Mastered</td>
            <td id="finishMastered"></td>
        </tr>

        <tr>
            <td>Remaining</td>
            <td id="finishRemaining"></td>
        </tr>

    </table>

    <br>

    <button onclick="showPage('setup')">
        Start Another Set
    </button>

    <button onclick="showPage('home')">
        Home
    </button>

</div>

    <br>

    <button onclick="showPage('setup')">
        Start Another Set
    </button>

    <button onclick="showPage('home')">
        Home
    </button>

</div>


</div>

</div>

<script src="app.js"></script>

</body>

</html>
